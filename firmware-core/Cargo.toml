[package]
name = "firmware-core"
version = "0.1.0"
edition = "2024"
description = "Hardware-independent logic shared with firmware/ (JSON contract types, weather/climate formatting, kiosk layout math) - split out so it can be unit-tested with a normal host `cargo test` instead of firmware's embedded target/runner."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
