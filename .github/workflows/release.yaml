name: Release

# Builds the firmware and publishes a flashable release on every `v*` tag push: the same
# `paws ci --toolchain esp32` build this repo's CI already runs, plus `--publish-artifacts` to
# upload the resulting bootloader.bin + firmware ELF onto the matching GitHub Release (created
# automatically if it doesn't already exist - see paws's `GitHubReleaseClient::
# get_or_create_release`). Doesn't flash anything itself - CI has no way to reach a physical
# device - this only produces what CONTRIBUTING.md's manual `espflash flash --bootloader
# bootloader.bin firmware --port ...` step needs, ready to download instead of building locally.
#
# Tag manually for now (`git tag vX.Y.Z && git push --tags`) - no automated version-bump step
# yet; revisit with `paws semver --push` once there's an actual versioning convention worth
# automating for this repo.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-firmware:
    name: Build and publish firmware release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mbround18/paws/actions/paws-up@main
      - name: paws ci --toolchain esp32 --publish-artifacts
        working-directory: firmware
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: paws ci --toolchain esp32 --publish-artifacts
