@version: 4.7

source s_network {
    udp(ip(0.0.0.0) port(514));
    tcp(ip(0.0.0.0) port(601));
};

destination d_messages {
    file("/var/log/messages");
};

destination d_by_host {
    file("/var/log/hosts/${HOST}.log" create-dirs(yes));
};

log {
    source(s_network);
    destination(d_messages);
    destination(d_by_host);
};
