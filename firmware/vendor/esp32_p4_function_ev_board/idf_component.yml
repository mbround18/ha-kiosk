dependencies:
  esp_codec_dev:
    public: true
    version: ~1.5
  esp_lcd_ek79007: '>=2.0.1,<3.0.0'
  esp_lcd_ili9881c:
    version: '>=1.0.3,<2.0.0'
  esp_lcd_touch_gt911:
    version: ^1
  # Pinned to an older release to test for a driver-level regression: our vendored New_Panel BSP
  # + registry-latest 2.0.2 shows color-banding/stretching on this unit that persisted across 6
  # independent DSI-config/WiFi isolation tests, while the vendor's own older v2.7 factory
  # firmware (same JD9165 panel/cable) renders cleanly - see project_hardware memory.
  esp_lcd_jd9165: "2.0.0"
